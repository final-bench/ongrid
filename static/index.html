*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--fg);overflow:hidden;font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;

#stars{position:fixed;inset:0;z-index:0}
#graph{position:fixed;inset:0;z-index:1}
#flash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;

h1{font-size:15px;margin:0 0 2px;font-weight:800;letter-spacing:.3px}
.sub{font-size:11px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.rail{position:fixed;top:0;left:0;margin:14px;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  width:286px;max-width:calc(100vw - 28px);background:var(--panel);border:1px solid var(--panel-br);border-radius:16px;

.stats{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.stat{flex:1 1 44px;background:rgba(255,255,255,.05);border:1px solid var(--panel-br);border-radius:10px;padding:6px 7px}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.stat span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.btn{display:block;width:100%;text-align:center;padding:10px;border-radius:11px;border:1px solid var(--accent);

.ask{display:flex;gap:6px;margin-bottom:8px}
#ask{flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--panel-br);background:rgba(255,255,255,.05);color:var(--fg);font-size:13px;outline:none}

#langsel{display:flex;gap:5px;margin-bottom:10px}
.langbtn{flex:1;padding:5px 4px;border-radius:9px;border:1px solid var(--panel-br);background:rgba(255,255,255,.04);color:var(--muted);font-size:11px;cursor:pointer}
.langbtn.on{border-color:var(--accent);color:#eaf6ff;background:rgba(78,168,255,.14);font-weight:700}
.exlabel{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px}
#examples{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.exq{font-size:10.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--panel-br);background:rgba(78,168,255,.09);color:#bcd4f5;cursor:pointer;text-align:left}

.answer{background:rgba(52,245,197,.06);border:1px solid rgba(52,245,197,.28);border-radius:11px;padding:11px;margin-bottom:10px;font-size:12px;line-height:1.55}
.answer .q{color:var(--ok);font-weight:700;margin-bottom:5px}
.answer .rel{font-size:11px;color:var(--muted);margin:7px 0 3px;text-transform:uppercase;letter-spacing:.5px}

.answer b.hit{color:#fff;cursor:pointer;text-decoration:underline dotted}

.dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor,0 0 4px currentColor}
.hint{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.5}

.info .desc{font-size:12px;line-height:1.55;margin:8px 0 12px;color:#cdd9f0}
.info .rel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
.info ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}

.info li:hover{border-color:var(--panel-br)}
.info li .e{color:var(--muted);font-size:10.5px;flex:none}
.close{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:8px;border:none;background:rgba(255,255,255,.07);color:var(--fg);cursor:pointer;font-size:15px;line-height:1}

</style>

function L(k){return (STR[LANG]||STR.en)[k];}
function nm(n){return (LANG==="ko"?n.name:LANG==="zh"?(n.name_zh||n.name_en||n.name):(n.name_en||n.name))||n.name;}
function rl(l){return (LANG==="ko"?l.rel:LANG==="zh"?(l.rel_zh||l.rel_en||l.rel):(l.rel_en||l.rel))||l.rel;}

function setGroups(map){GROUPS={};Object.keys(map).forEach((k,i)=>{const v=map[k];
  const label=(v&&typeof v==="object")?(v[LANG]||v.en||k):v;GROUPS[k]={label,color:PAL[i%PAL.length]};});}
const gcol=g=>(GROUPS[g]||{color:"#88a"}).color;
const idStr=x=>typeof x==="object"?x.id:x;
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function dimmed(n){if(hidden.has(n.group))return true;if(focusSet&&!focusSet.has(n.id))return true;return false;}
function ncolor(n){return dimmed(n)?"rgba(120,130,160,0.18)":gcol(n.group);}
function vis(l){const s=byId[idStr(l.source)],t=byId[idStr(l.target)];if(!s||!t)return false;return !dimmed(s)&&!dimmed(t);}
function refresh(){if(G)G.nodeColor(ncolor).linkColor(lcolor).linkWidth(lwidth).linkDirectionalParticles(lpart);}
function lcolor(l){if(!vis(l))return "rgba(120,130,150,.02)";const s=byId[idStr(l.source)];return (s?gcol(s.group):"#8aaacc")+"66";}
function lwidth(l){return vis(l)?0.5:0;}
function lpart(l){return vis(l)?2:0;}
// 그룹별 중심으로 당겨 색깔 클러스터를 형성
function clusterForce(strength){let ns;
  function f(alpha){const c={},cnt={};
    ns.forEach(n=>{const g=n.group;(c[g]=c[g]||{x:0,y:0,z:0});c[g].x+=n.x||0;c[g].y+=n.y||0;c[g].z+=n.z||0;cnt[g]=(cnt[g]||0)+1;});
    for(const g in c){c[g].x/=cnt[g];c[g].y/=cnt[g];c[g].z/=cnt[g];}
    const k=strength*alpha;
    ns.forEach(n=>{const q=c[n.group];if(!q)return;n.vx=(n.vx||0)+(q.x-(n.x||0))*k;n.vy=(n.vy||0)+(q.y-(n.y||0))*k;n.vz=(n.vz||0)+(q.z-(n.z||0))*k;});}
  f.initialize=n=>{ns=n;};return f;}

function render(data){
  CUR=data;focusSet=null;setGroups(data.groups);
  nodes=data.nodes.map(n=>({...n,_all:[n.name,n.name_en,n.name_zh].filter(Boolean).map(s=>s.toLowerCase()),name:nm(n)}));
  links=data.links.map(l=>({source:l.source,target:l.target,rel:rl(l)||"RelatedTo"}));
  byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  links=links.filter(l=>byId[idStr(l.source)]&&byId[idStr(l.target)]);
  const deg={};links.forEach(l=>{deg[l.source]=(deg[l.source]||0)+1;deg[l.target]=(deg[l.target]||0)+1;});
  nodes.forEach(n=>n.val=Math.min(4.2,0.6+Math.sqrt(deg[n.id]||0)*0.6));
  document.getElementById("s-n").textContent=nodes.length;
  document.getElementById("s-l").textContent=links.length;
  document.getElementById("s-d").textContent=ENGINE.docs||1;
  document.getElementById("s-t").textContent=Object.keys(ENGINE.idf).length||"—";
  hidden.clear();buildLegend();
  const elG=document.getElementById("graph");
  if(!G){
    const t=document.createElement("canvas");const gl=t.getContext("webgl2")||t.getContext("webgl");
    if(!gl){const b=document.getElementById("busy");b.hidden=false;
      b.innerHTML="<div style='max-width:420px;text-align:center;line-height:1.7;padding:20px'>이 브라우저에서 WebGL(3D)을 쓸 수 없습니다.<br>열린 탭을 줄이거나 브라우저를 새로 켠 뒤 새로고침해 주세요.</div>";return;}
    try{
      G=ForceGraph3D()(elG).backgroundColor("rgba(0,0,0,0)")
        .nodeId("id").nodeVal("val").nodeRelSize(2.2).nodeResolution(10).nodeOpacity(.95)
        .nodeColor(ncolor)
        .nodeLabel(n=>"<div style='font:700 11px Inter,sans-serif;color:#fff;background:rgba(6,10,24,.92);padding:3px 8px;border-radius:7px;border:1px solid "+gcol(n.group)+";max-width:260px'>"+esc(n.name)+"</div>")
        .linkCurvature(0.28)
        .linkColor(lcolor).linkWidth(lwidth).linkOpacity(.45)
        .linkDirectionalParticles(lpart).linkDirectionalParticleWidth(2.3)
        .linkDirectionalParticleSpeed(()=>.004+Math.random()*.004)
        .linkDirectionalParticleColor(l=>{const s=byId[idStr(l.source)];return s?gcol(s.group):"#9ad";})
        .linkLabel(l=>l.rel)
        .onNodeClick(focusNode).onBackgroundClick(()=>{closePanel();if(focusSet){focusSet=null;refresh();}})
        .cooldownTicks(160);
      G.d3Force("charge").strength(nodes.length>120?-60:-80);
      G.d3Force("link").distance(nodes.length>120?34:40);
      G.d3Force("cluster",clusterForce(0.22));   // 그룹별 뭉침(클러스터)
      try{if(window.UnrealBloomPass&&window.THREE){
        const bloom=new window.UnrealBloomPass(new window.THREE.Vector2(innerWidth,innerHeight),1.5,0.9,0.1);
        window.__bloom=bloom;G.postProcessingComposer().addPass(bloom);}
      }catch(be){console.warn("bloom off",be);}
    }catch(e){const b=document.getElementById("busy");b.hidden=false;
      b.innerHTML="<div style='max-width:420px;text-align:center;line-height:1.7;padding:20px'>3D 렌더링을 시작할 수 없습니다 ("+((e&&e.message)||e)+").<br>탭을 줄이거나 브라우저를 새로 켠 뒤 새로고침해 주세요.</div>";G=null;return;}
  }
  G.graphData({nodes,links});
  G.cameraPosition({z:nodes.length>120?900:440});
  sizeAll();
  reveal();
}

// ===== 생성 연출: 플래시 + 카메라 플라이인 + 카운트업 (three 불필요) =====
function countUp(id,to){const el=document.getElementById(id);const t0=performance.now();
  (function st(){const k=Math.min(1,(performance.now()-t0)/1200);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st);})();}
function fitDist(){const rs=[];for(const n of nodes)rs.push(Math.hypot(n.x||0,n.y||0,n.z||0));rs.sort((a,b)=>a-b);
  const r85=rs[Math.floor(rs.length*0.85)]||120;return Math.max(150,r85*2.0);}
function flyTo(z,dur){if(!G)return;const p0=G.cameraPosition();const c0=Math.hypot(p0.x,p0.y,p0.z)||1;
  const ux=p0.x/c0,uy=p0.y/c0,uz=p0.z/c0;const t0=performance.now();
  (function f(){if(window.__userCam||!G)return;const k=Math.min(1,(performance.now()-t0)/dur);const e=1-Math.pow(1-k,3);
    const z2=c0+(z-c0)*e;G.cameraPosition({x:ux*z2,y:uy*z2,z:uz*z2});if(k<1)requestAnimationFrame(f);})();}
function reveal(){
  if(!G||!nodes.length)return;
  window.__userCam=false;
  const fl=document.getElementById("flash");fl.style.transition="none";fl.style.opacity="0.92";
  requestAnimationFrame(()=>{fl.style.transition="opacity 1.2s ease";fl.style.opacity="0";});
  G.cameraPosition({x:0,y:0,z:1500});
  setTimeout(()=>flyTo(fitDist(),1500),1600);
  setTimeout(()=>flyTo(fitDist(),1100),4200);
  countUp("s-n",nodes.length);countUp("s-l",links.length);
}

const STOP=new Set("the a an and or but for nor so yet of to in on at by is are was were be been being as it its this that these those with from into over under then than there their them they you your we our us he she his her not no can could will would shall should may might must do does did has have had which who whom whose what when where why how all any both each few more most other some such only own same too very just about above after again against because before below between during further here once".split(/\s+/));
function sentences(t){return t.replace(/\s+/g," ").split(/(?<=[.!?。！？\n])\s+|[\n·•]+/).map(s=>s.trim()).filter(s=>s.length>2&&s.length<400);}
function toks(s){return (s.toLowerCase().match(/[a-z0-9]+|[가-힣]{2,}/g)||[]).filter(w=>w.length>2&&!STOP.has(w));}
function buildOntology(docs){
  const freq={},bg={},wiki=new Set();const allSents=[];
  docs.forEach((d,di)=>{
    (d.text.match(/\[\[([^\]]+)\]\]/g)||[]).forEach(m=>wiki.add(m.slice(2,-2).trim().toLowerCase()));
    sentences(d.text).forEach(s=>{const tk=toks(s);allSents.push({doc:di,text:s,tk});
      tk.forEach((w,i)=>{freq[w]=(freq[w]||0)+1;if(i<tk.length-1){const b=w+" "+tk[i+1];bg[b]=(bg[b]||0)+1;}});});
  });
  ENGINE.docs=docs.length;ENGINE.sents=allSents;
  const ents=new Set([...wiki].filter(w=>w));
  Object.entries(freq).filter(([w,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,200).forEach(([w])=>ents.add(w));
  Object.entries(bg).filter(([w,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,80).forEach(([w])=>ents.add(w));
  const E=[...ents];const Eset=new Set(E);
  const edges={},rels={};const nodeSents={},nodeTF={};const co={};
  const addE=(a,b,r)=>{if(a===b||!Eset.has(a)||!Eset.has(b))return;const k=a+"\u0001"+b;if(!edges[k]){edges[k]={source:a,target:b,rel:r};rels[r]=(rels[r]||0)+1;}};
  const P=[[/(.+?)\s+(?:is|are|was|were)\s+(?:a|an|the)?\s*(.+)/,"IsA"],
          [/(.+?)\s+(?:has|have|contains?|includes?)\s+(.+)/,"HasA"],
          [/(.+?)\s+(?:use[sd]?|used for|used to)\s+(.+)/,"UsedFor"],
          [/(.+?)\s+(?:can|could|able to)\s+(.+)/,"CapableOf"],
          [/(.+?)\s+(?:part of|belongs? to|of)\s+(.+)/,"PartOf"],
          [/(.+?)(?:는|은|이|가)\s*(.+?)(?:이다|다|이라|입니다|이에요|예요)/,"IsA"]];
  allSents.forEach(S=>{
    const present=E.filter(e=>S.text.toLowerCase().includes(e));
    present.forEach(e=>{(nodeSents[e]=nodeSents[e]||[]).push(S.text);const m=nodeTF[e]=nodeTF[e]||{};S.tk.forEach(w=>m[w]=(m[w]||0)+1);});
    for(const [re,r] of P){const mm=S.text.toLowerCase().match(re);
      if(mm){const h=present.find(e=>mm[1].includes(e)),t=present.find(e=>e!==h&&mm[2].includes(e));if(h&&t)addE(h,t,r);}}
    const p6=present.slice().sort((a,b)=>(freq[b]||0)-(freq[a]||0)).slice(0,6);
    for(let i=0;i<p6.length;i++)for(let j=i+1;j<p6.length;j++){const k=p6[i]<p6[j]?p6[i]+"\u0001"+p6[j]:p6[j]+"\u0001"+p6[i];co[k]=(co[k]||0)+1;}
  });
  const coTh=docs.length>1?2:1;
  Object.entries(co).sort((a,b)=>b[1]-a[1]).forEach(([k,c])=>{if(c>=coTh){const [a,b]=k.split("\u0001");addE(a,b,"RelatedTo");}});
  let L=Object.values(edges);
  const deg={};L.forEach(l=>{deg[l.source]=(deg[l.source]||0)+1;deg[l.target]=(deg[l.target]||0)+1;});
  let keep=new Set(E.filter(e=>deg[e]>0));
  if(keep.size>220)keep=new Set([...keep].sort((a,b)=>(deg[b]||0)-(deg[a]||0)).slice(0,220));
  L=L.filter(l=>keep.has(l.source)&&keep.has(l.target)).slice(0,600);
  const used=new Set();L.forEach(l=>{used.add(l.source);used.add(l.target);});
  const df={};allSents.forEach(S=>{new Set(S.tk).forEach(w=>df[w]=(df[w]||0)+1);});
  const N=allSents.length||1;ENGINE.idf={};Object.keys(df).forEach(w=>ENGINE.idf[w]=Math.log(1+N/df[w]));ENGINE.tf=nodeTF;
  const relByNode={};L.forEach(l=>{(relByNode[l.target]=relByNode[l.target]||{})[l.rel]=((relByNode[l.target]||{})[l.rel]||0)+1;(relByNode[l.source]=relByNode[l.source]||{})[l.rel]=((relByNode[l.source]||{})[l.rel]||0)+1;});
  const topRels=Object.entries(rels).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
  const RELKO={IsA:"종류(IsA)",UsedFor:"쓰임(UsedFor)",HasA:"보유(HasA)",CapableOf:"능력(CapableOf)",PartOf:"부분(PartOf)",RelatedTo:"연관(RelatedTo)"};
  const groups={};topRels.forEach(r=>groups[r]=RELKO[r]||r);
  const grp=id=>{const rc=relByNode[id]||{};for(const r of Object.keys(rc).sort((a,b)=>rc[b]-rc[a]))if(groups[r])return r;return topRels[0]||"RelatedTo";};
  const nodesO=[...used].map(id=>({id,name:id,group:grp(id),desc:(nodeSents[id]||[])[0]||""}));
  return {groups,nodes:nodesO,links:L};
}

const GENERIC=new Set(["this","that","something","someone","somebody","anything","everything","thing","it","one","people"]);
function contentToks(q){return (q.toLowerCase().match(/[a-z0-9]{2,}|[가-힣]{2,}|[一-鿿]{2,}/g)||[]).filter(w=>!STOP.has(w));}
function retrieve(q){
  const qt=contentToks(q);
  const nmById=id=>{const x=byId[id];return x?x.name:id;};
  // 1) 질의어 ↔ 노드의 모든 언어 이름 매칭 (정확>단어>부분)
  const sc=[];
  nodes.forEach(n=>{let s=0;n._all.forEach(a=>{const words=a.split(/\s+/);
    qt.forEach(t=>{if(a===t)s+=12;else if(words.includes(t))s+=7;
      else if(a.length>=2&&t.includes(a))s+=6;      // 토큰이 노드명 포함 (한국어 조사 등: "양자관련"→"양자")
      else if(t.length>=3&&a.includes(t))s+=2;});});
    if(s>0&&!GENERIC.has(n.name.toLowerCase()))sc.push([n.id,s]);});
  sc.sort((a,b)=>b[1]-a[1]);
  const strong=sc.filter(x=>x[1]>=7);
  const focusIds=(strong.length?strong:sc).slice(0,3).map(x=>x[0]);
  const focusId=focusIds[0]||null;
  const fset=new Set(focusIds);
  let factEdges=links.filter(l=>fset.has(idStr(l.source))||fset.has(idStr(l.target)));
  factEdges.sort((a,b)=>(fset.has(idStr(b.source))?1:0)-(fset.has(idStr(a.source))?1:0));
  factEdges=factEdges.slice(0,32);
  const facts=factEdges.map(l=>nmById(idStr(l.source))+" — "+l.rel+" → "+nmById(idStr(l.target)));
  return {facts,focusId,factEdges};
}
async function runAsk(){
  const q=document.getElementById("ask").value.trim();if(!q)return;
  const ans=document.getElementById("answer");
  const {facts,focusId,factEdges}=retrieve(q);
  // 그래프 포커싱
  if(focusId){const fn=byId[focusId];
    focusSet=new Set([focusId,...factEdges.flatMap(l=>[idStr(l.source),idStr(l.target)])]);refresh();
    if(fn&&fn.x!==undefined)focusNode(fn);}
  ans.hidden=false;ans.innerHTML="<div class='q'>"+esc(q)+"</div><span style='color:var(--muted)'>"+L("thinking")+"</span>";
  let answer="";
  try{
    const r=await fetch("ask",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({query:q,facts,lang:LANG})});
    if(r.ok){const d=await r.json();answer=d.answer||"…";}
    else answer="(LLM "+r.status+")";
  }catch(e){answer=L("noconn");}
  let html="<div class='q'>"+esc(q)+"</div>";
  html+="<div style='white-space:pre-wrap'>"+esc(answer)+"</div>";
  if(facts.length){html+="<div class='rel'>"+L("evid")+" "+facts.length+"</div>"+facts.slice(0,8).map(f=>"<div class='ev'>"+esc(f)+"</div>").join("");}
  else html+="<div class='rel'>"+L("evid")+"</div><span style='color:var(--muted)'>"+L("nofact")+"</span>";
  html+="<div class='rel'>ZTC 판정</div><span id='ztcbadge' style='color:var(--muted)'>ZTC-Judge 검증 중…</span>";
  ans.innerHTML=html;
  // ZTC-Judge(ZeroGPU)로 답변 신뢰도 판정 — 비동기, 실패해도 답변엔 영향 없음
  if(answer&&!/^\(/.test(answer)){fetch("verify",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({query:q,answer})})
    .then(r=>r.json()).then(d=>{const el=document.getElementById("ztcbadge");if(!el)return;
      if(d&&d.ok&&d.ztc){const z=d.ztc;const col=z.verdict&&z.verdict.indexOf("이상")>=0?"#34f5c5":(z.verdict&&z.verdict.indexOf("검토")>=0?"#ff5d8f":"#ffb020");
        el.innerHTML="<b style='color:"+col+"'>"+esc(z.verdict||"")+"</b> <span style='color:var(--muted)'>· score "+(z.score)+" · zero-token</span>";}
      else{el.textContent="(ZTC 서버 준비 중 — 잠시 후 다시 시도)";}})
    .catch(()=>{const el=document.getElementById("ztcbadge");if(el)el.textContent="(ZTC 미연결)";});}
}

// ===== starfield + resize =====
const sc2=document.getElementById("stars"),sx=sc2.getContext("2d");let stars=[];
function sizeAll(){const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
  sc2.width=w*dpr;sc2.height=h*dpr;sc2.style.width=w+"px";sc2.style.height=h+"px";sx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:Math.round(w*h/4300)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.2,a:Math.random()*.6+.2,t:Math.random()*6}));
  if(G){const e=document.getElementById("graph");G.width(e.clientWidth).height(e.clientHeight);}
  if(window.__bloom)try{window.__bloom.setSize(innerWidth,innerHeight);}catch(_){}}
function drawStars(ts){const w=innerWidth,h=innerHeight;sx.clearRect(0,0,w,h);
  for(const s of stars){const tw=s.a*(.6+.4*Math.sin(ts/700+s.t));sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.283);sx.fillStyle="rgba(200,220,255,"+tw+")";sx.fill();}
  requestAnimationFrame(drawStars);}
addEventListener("resize",sizeAll);requestAnimationFrame(drawStars);
document.getElementById("graph").addEventListener("pointerdown",()=>{window.__userCam=true;},true);

applyLang(LANG);
render(DEMO);
</script>
